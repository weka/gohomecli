name: release-homecli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.4.25)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write # to create tags and github releases

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4.1.1
        with:
          ref: release/v0.4
          fetch-depth: 0

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}" -m "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Build binaries
        run: |
          chmod +x ./build.sh
          ./build.sh "${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          draft: false
          generate_release_notes: true
          files: |
            bin/homecli_linux_amd64
            bin/homecli_darwin_amd64
